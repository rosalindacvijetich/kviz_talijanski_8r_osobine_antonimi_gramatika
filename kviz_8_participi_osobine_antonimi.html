<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talijanski 8. razred — participi i osobine</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#20324b;background:#f3f7ff}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:760px;margin:auto}.top{background:linear-gradient(130deg,#dbeaff,#ffe5eb);padding:24px;border-radius:22px}h1{margin:0;font-size:clamp(24px,5vw,36px)}p{line-height:1.5}.stats{display:flex;justify-content:space-between;margin:16px 0;font-weight:700}.bar{height:12px;background:#dce4f0;border-radius:20px;overflow:hidden}.fill{height:100%;background:#55b894;width:0;transition:.35s}.question{background:#fff;padding:22px;border-radius:20px;box-shadow:0 5px 22px #24314f17;margin-top:18px}h2{font-size:21px}.choices{display:grid;gap:11px}.choice{padding:14px;border:2px solid #dbe5f3;background:white;border-radius:14px;font:inherit;text-align:left;cursor:pointer}.choice:hover:not(:disabled){background:#edf6ff}.choice.correct{border-color:#23ad70;background:#ddf8e9}.choice.wrong{border-color:#e57988;background:#ffe7eb}.choice:disabled{cursor:default}.feedback{margin-top:14px;padding:12px;border-radius:12px;background:#eff8ff;min-height:46px}.next,.restart{padding:13px 22px;background:#364fba;color:white;border:0;border-radius:14px;font:inherit;font-weight:700;cursor:pointer;margin-top:16px}.next:disabled{opacity:.4}.celebrate{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.5);background:white;border:4px solid #59c88c;padding:18px 32px;border-radius:25px;font-size:clamp(24px,5vw,38px);font-weight:800;z-index:5;box-shadow:0 12px 40px #0002;pointer-events:none;animation:pop .85s forwards}@keyframes pop{0%{opacity:0;transform:translate(-50%,-40%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.95)}}.hidden{display:none}.end{background:#fff;border-radius:22px;padding:28px;text-align:center}.small{color:#596d82;font-size:14px}@media(prefers-reduced-motion:reduce){.celebrate{animation:none;display:none}}</style></head><body><main><div class="top"><h1>🇮🇹 Talijanski — 8. razred</h1><p>🌼 Participio passato + pregi e difetti + antonimi</p><p>Odaberi odgovor. Za točan odgovor dobivaš veselu čestitku! Pogrešan odgovor možeš ispraviti.</p></div><div class="stats"><span id="counter">Pitanje 1 / 25</span><span id="score">Točno iz prvog pokušaja: 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><section id="quiz" class="question"><h2 id="prompt"></h2><div id="choices" class="choices"></div><div class="feedback" id="feedback" role="status">Odaberi jedan odgovor.</div><button class="next" id="next" disabled>Sljedeće pitanje →</button></section><section id="end" class="end hidden"><h2>🌷 Bravissimo!</h2><h3 id="result"></h3><p>Ponovi kviz i pokušaj poboljšati rezultat!</p><button class="restart" onclick="restart()">Ponovi kviz ↺</button></section></main><script>const data=[{"q": "Koji je particip glagola LEGGERE?", "o": ["leggiuto", "letto", "leggato"], "a": 1, "e": "Leggere → letto (nepravilni particip)."}, {"q": "Koji je infinitiv participa SCRITTO?", "o": ["scrivere", "studiare", "sentire"], "a": 0, "e": "Scritto dolazi od scrivere = pisati."}, {"q": "Koji je particip glagola FARE?", "o": ["fato", "facito", "fatto"], "a": 2, "e": "Fare → fatto."}, {"q": "Koji je infinitiv participa MANGIATO?", "o": ["mangiare", "mettere", "mancare"], "a": 0, "e": "Mangiare = jesti, mangiato = jeo/jela."}, {"q": "Koji je particip glagola DARE?", "o": ["duto", "dato", "detto"], "a": 1, "e": "Dare → dato; dire → detto."}, {"q": "Kako glasi particip glagola RICEVERE?", "o": ["ricevuto", "ricevato", "ricevito"], "a": 0, "e": "Ricevere → ricevuto."}, {"q": "Koji je infinitiv participa PARTITO?", "o": ["portare", "partire", "parlare"], "a": 1, "e": "Partire → partito = otputovati."}, {"q": "Koji je particip glagola VEDERE?", "o": ["veduto samo", "visto", "vedato"], "a": 1, "e": "U školskom gradivu uči se vedere → visto."}, {"q": "Koji je particip glagola PRENDERE?", "o": ["prenduto", "preso", "prendato"], "a": 1, "e": "Prendere → preso."}, {"q": "Dopuni: Ieri io ___ studiato.", "o": ["sono", "ho", "hai"], "a": 1, "e": "Studiare obično gradi passato prossimo s avere: ho studiato."}, {"q": "Dopuni (djevojčica): Sono ___ a scuola.", "o": ["andato", "andati", "andata"], "a": 2, "e": "Uz essere particip se slaže s rodom: andata."}, {"q": "Koji je antonim od ANTIPATICO?", "o": ["simpatico", "pigro", "testardo"], "a": 0, "e": "Antipatico ↔ simpatico."}, {"q": "Koji je antonim od SINCERO?", "o": ["generoso", "bugiardo", "curioso"], "a": 1, "e": "Sincero (iskren) ↔ bugiardo (lažljiv)."}, {"q": "Koji je antonim od PESSIMISTA?", "o": ["ottimista", "egoista", "ordinato"], "a": 0, "e": "Pessimista ↔ ottimista."}, {"q": "Koji je antonim od ALTRUISTA?", "o": ["gentile", "egoista", "diligente"], "a": 1, "e": "Altruista (nesebičan) ↔ egoista (sebičan)."}, {"q": "Koji je antonim od PIGRO?", "o": ["paziente", "testardo", "diligente"], "a": 2, "e": "Pigro (lijen) ↔ diligente (marljiv)."}, {"q": "Što znači PAZIENTE?", "o": ["strpljiv", "nepristojan", "lažljiv"], "a": 0, "e": "Paziente znači strpljiv."}, {"q": "Što znači TESTARDO?", "o": ["radoznao", "tvrdoglav", "marljiv"], "a": 1, "e": "Testardo znači tvrdoglav."}, {"q": "Što znači GENEROSO?", "o": ["velikodušan", "sebičan", "potišten"], "a": 0, "e": "Generoso znači velikodušan."}, {"q": "Koja je osobina: \"Mette le cose al proprio posto\"?", "o": ["ordinato", "bugiardo", "pigro"], "a": 0, "e": "Ordinato je uredan: stavlja stvari na svoje mjesto."}, {"q": "Koja je osobina: \"Non dice sempre la verità\"?", "o": ["sincero", "bugiardo", "gentile"], "a": 1, "e": "Bugiardo je lažljiv."}, {"q": "Što znači CURIOSO?", "o": ["znatiželjan", "strpljiv", "lijen"], "a": 0, "e": "Curioso znači znatiželjan."}, {"q": "Koja riječ opisuje nekoga tko pomaže drugima?", "o": ["egoista", "altruista", "antipatico"], "a": 1, "e": "Altruista je nesebična osoba koja pomaže drugima."}, {"q": "Što znači MALEDUCATO?", "o": ["uredan", "nepristojan", "dobar"], "a": 1, "e": "Maleducato znači nepristojan."}, {"q": "Dopuni: Noi ___ guardato un film.", "o": ["avete", "abbiamo", "siamo"], "a": 1, "e": "Noi abbiamo guardato un film."}];let i=0,score=0,tries=0,done=false;const $=id=>document.getElementById(id);function render(){done=false;tries=0;const x=data[i];$('counter').textContent=`Pitanje ${i+1} / ${data.length}`;$('score').textContent=`Točno iz prvog pokušaja: ${score}`;$('fill').style.width=(i/data.length*100)+'%';$('prompt').textContent=x.q;$('choices').replaceChildren();x.o.forEach((o,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>choose(j,b);$('choices').appendChild(b)});$('feedback').textContent='Odaberi jedan odgovor.';$('next').disabled=true}function choose(j,b){if(done)return;const x=data[i];tries++;if(j===x.a){done=true;b.classList.add('correct');for(const bt of $('choices').children)bt.disabled=true;if(tries===1)score++;$('feedback').textContent='✅ '+x.e;$('score').textContent=`Točno iz prvog pokušaja: ${score}`;$('next').disabled=false;const el=document.createElement('div');el.className='celebrate';el.textContent=['🌼 Bravo! ✅','🌸 Odlično! ✅','🌻 Bravissimo! ✅','🌷 Sjajno! ✅'][i%4];document.body.append(el);setTimeout(()=>el.remove(),850)}else{b.classList.add('wrong');b.disabled=true;$('feedback').textContent='Pokušaj ponovno! Razmisli o značenju ili pravilu.'}}$('next').onclick=()=>{i++;if(i===data.length){$('quiz').classList.add('hidden');$('end').classList.remove('hidden');$('fill').style.width='100%';$('counter').textContent='Kviz završen';$('result').textContent=`${score} / ${data.length} točno iz prvog pokušaja`;}else render()};function restart(){i=0;score=0;$('end').classList.add('hidden');$('quiz').classList.remove('hidden');render()}render();</script></body></html>
